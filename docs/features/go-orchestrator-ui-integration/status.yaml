    note: "Feature created (tracked ts; the go orchestrator it builds is still in
      development). Fixes the go-orchestrator tasks last-mile: hermes-agent's
      write_tasks currently writes go task rows straight to Postgres during
      breakdown, bypassing the human tasks-stage approval, the docs PR merge,
      and the validating workflow-backend API. Target: write_tasks produces
      tasks.md only; the tasks-stage approve command does promote -> merge docs
      PR -> update DB status -> create tasks via API; plus a
      precondition-checked backup /create-tasks command. UI board/status gaps
      split into a separate follow-up feature."
