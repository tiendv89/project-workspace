    note: >-
      Reviewed prior WIP on origin/feature/notification-service-T7 (commits
      d782238, 953acb3 by tiendv.52@gmail.com): InAppNotificationAdapter,
      port, main.ts registration, and stage-approval/task-done wiring were
      already implemented with 44 passing unit tests. Fixed a real bug in
      check-tasks-done.ts — task_done notifications fired unconditionally
      before fireHandoffTrigger, so a transient handoff failure caused
      re-sends on every retry poll; added a notifiedTaskDone dedup set
      (mirrors notifiedStageApprovals) threaded through main.ts's
      per-workspace FeatureNotificationState, plus a regression test.
      Confirmed no regressions against origin/main (same 2 pre-existing,
      unrelated run-claude.test.ts failures and same @workflow/runtime-abi
      workspace-linking typecheck errors on both branches). Checked off
      completed subtasks in tasks.md. Known unresolved gap, left unchecked:
      stage-approval "who is watching" falls back to reviewed_by (the
      approver) rather than hermes-agent session members, since
      agent-workflow has no existing integration to resolve that set; and
      main.ts's InAppNotificationAdapter factory never supplies a
      userIdResolver, so resolveUserId always returns null and every in-app
      notification is currently a silent no-op end-to-end. Both require new
      cross-repo work (a hermes-agent session-member API; an email->user_id
      lookup, undesigned anywhere in the technical design) beyond this
      task's repo scope. Committed locally on feature/notification-service-T7
      (988c054, b341e8d0) but NOT pushed — this sandbox has no network
      route to github.com over SSH, and an HTTPS+token push attempt was
      blocked by the environment's security policy as an unverified-remote
      exfiltration risk. No PR opened. Status left at in_progress since no
      PR exists to review.
