      TaskNotifierPort adapter removal moved to T4. T4 and T5 now depend on T8.
      Wave structure is 5 waves: T1+T2+T7 → T3 → T8 → T4+T5+T9 → T6.
  - at: 2026-05-24T01:28:33+0700
    by: matthew@swellnetwork.io
    action: scope_clarified
    note: >-
      Added T7 (workspace-github-adapter): slack_channel_id moves from
      SLACK_CHANNEL_ID env var to workspace.yaml notifications.slack.channel_id,
