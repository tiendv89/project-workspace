    by: matthew@swellnetwork.io
    action: feature_created
    note: >-
      Spun out from adding-hermes-executor discussion. The Hermes cluster
      controller correctly holds model credentials internally; the Claude
      executor incorrectly inherits ANTHROPIC_API_KEY from the orchestrator
      environment via process.env spread. This feature fixes that boundary.

