stages:
  product_spec:
    review_status: approved
    reviewed_by: pentative@gmail.com
    reviewed_at: 2026-07-05T00:49:05+0700
    review_comment: "Approved. Scope: bring /review-pr's rigor (shared
      review_criteria.md rubric, real GitHub review posting) into M3 Agent Chat
      via a new hermes-agent tool, decoupled from orchestrator task state (no
      result.json, no cycle-limit escalation, no auto-merge). Includes a
      broadened set of read-only GitHub context tools (G7: PR diff/metadata/
      comments/review-history/CI-status, open-PR listing, commit history, ref
      comparison, full-file-at-ref reads) and a verbatim snapshot of the source
      skill content in the Appendix for the hermes-agent mirror. Open questions
      (credential path/scope, posting identity, v1 container scope, rubric sync
      mechanism, CI-poll timeout) carried forward into technical design."
    review_history:
      - review_status: approved
        reviewed_by: pentative@gmail.com
        reviewed_at: 2026-07-05T00:49:05+0700
        review_comment: Approved; proceed to technical design.
  technical_design:
    review_status: approved
    reviewed_by: pentative@gmail.com
    reviewed_at: 2026-07-05T11:51:03+0700
    review_comment: "Approved. Chosen design: two new hermes-agent tools —
      github_pr_context (read-only, action-enum selector matching the existing
      gitnexus.py/rag.py convention, satisfies G7) and github_pr_review (write,
      two-call posting pattern + self-review 422 handling, satisfies G3) — plus
      a rewrite of the already-bundled (but inert)
      plugins/skills/technical_skills/review-pr/SKILL.md to sequence load_skill
      -> context tool -> LLM reasoning against review_criteria.md -> posting
      tool, rather than a monolithic Python handler (rubric judgment stays an
      LLM reasoning step). No digital-factory-ui change required for v1 — the
      slash-command picker auto-derives from tool registration. OQ1
      (GITHUB_TOKEN scope) verified during design and cleared as a blocker; OQ2
      (posting identity) resolved to the existing shared bot token, no per-user
      identity exists; OQ3 (container scope) resolved to all containers, no
      gating needed; OQ4 (rubric sync) resolved to a manual re-copy +
      last-synced-marker discipline, no new CI infra; OQ5 (CI-poll timeout)
      resolved to a bounded 60s poll. Proceed to task breakdown."
    review_history:
      - review_status: approved
        reviewed_by: pentative@gmail.com
        reviewed_at: 2026-07-05T11:51:03+0700
        review_comment: Approved; proceed to task breakdown.
  tasks:
    review_status: approved
    reviewed_by: pentative@gmail.com
    reviewed_at: 2026-07-05T12:24:46+0700
    review_comment: "Approved. 4 tasks: T1 (hermes-agent github_pr_context read
      tool, G7, no deps), T2 (hermes-agent github_pr_review posting tool, G3,
      depends on T1), T3 (rewrite the already-bundled review-pr SKILL.md to the
      new tool-call sequence, depends on T1+T2), T4 (optional digital-factory-ui
      ReviewCard rendering, fast-follow, depends on T2, not required for
      acceptance criteria). Wave 1 (T1) activated to ready."
    review_history:
      - review_status: approved
        reviewed_by: pentative@gmail.com
        reviewed_at: 2026-07-05T12:24:46+0700
        review_comment: Approved; Wave 1 (T1) activated to ready.
  handoff:
    review_status: draft
