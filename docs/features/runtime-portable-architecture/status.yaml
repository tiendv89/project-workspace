feature_id: runtime-portable-architecture
title: Portable runtime architecture — extract today's bundled orchestrator/executor into ports, adapters, and profiles

feature_status: in_design
current_stage: product_spec
next_action: >-
  Feature rescoped from platform-byo-executor down to the architectural
  foundation only. Product spec and technical design rewritten for the
  narrower scope: hexagonal refactor, async submit/reap, two local
  profiles (local-subprocess, local-docker), no customer-facing surface.
  BYO product work deferred to a future feature.
  Ready for human review of the product spec; technical design can be
  reviewed in parallel.

