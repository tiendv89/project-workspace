history:
  - at: 2026-05-03T00:00:00+0700
    by: matthew@swellnetwork.io
    action: feature_created
    note: >-
      Feature initialized via /init-feature as platform-byo-executor.
      Original goal was to enable platform customers to register their
      own executor images and run tasks on tenant-isolated infrastructure.
      Product spec drafted with ten open questions (Q1–Q10).
  - at: 2026-05-03T22:46:04+0700
    by: matthew@swellnetwork.io
    action: feature_rescoped
    note: >-
      Feature renamed from platform-byo-executor to
      runtime-portable-architecture and rescoped to the architectural
      foundation only. Customer-facing BYO surface (image registration,
      conformance, tenant management, billing, pull-family runner agents,
      production push/pull adapters) deferred to a future feature.
      Remaining scope: hexagonal refactor (ports + adapters + profiles),
      async submit/reap, two local profiles (local-subprocess and
      local-docker), tenant-context plumbing without enforcement.
      The discussion-orchestrator-architecture.md document is preserved
      and includes the long-term BYO direction for the future feature
      to pick up.
