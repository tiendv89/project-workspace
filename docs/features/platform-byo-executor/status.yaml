history:
  - at: 2026-05-03T00:00:00+0700
    by: matthew@swellnetwork.io
    action: feature_created
    note: >-
      Feature initialized via /init-feature as platform-byo-executor.
      Original goal was to enable platform customers to register their
      own executor images and run tasks on tenant-isolated infrastructure.
      Product spec drafted with ten open questions (Q1–Q10).
  - at: 2026-05-03T22:46:04+0700
    by: matthew@swellnetwork.io
    action: feature_split
    note: >-
      Feature split: the architectural foundation moved to a new feature
      runtime-portable-architecture (took the discussion document, the
      hexagonal/ports/adapters/profiles design, and the async submit/reap
      decision). This feature retained the customer-facing BYO product
      surface (image registration, conformance, tenant management,
      runner agents, push/pull production adapters, billing) and was
      marked blocked on the architectural feature.
      Long-term direction preserved in product-spec.md as deferred goals
      and open questions B1–B7.
  - at: 2026-05-13T00:26:34+0700
    by: matthew@swellnetwork.io
    action: activated
    note: >-
      runtime-portable-architecture reached done status. Feature unblocked
      and moved to in_design. Deferred framing stripped from product-spec.md.
      agent-registration feature cancelled — its scope (agent registration
      and approval model) is subsumed here.

