    by: matthew@swellnetwork.io
    action: feature_created
    note: >-
      Feature initialized via /init-feature. Goal is to enable platform
      customers to register their own executor images and run tasks on
      tenant-isolated platform-provisioned infrastructure. Product spec
      is in draft with ten open questions (Q1–Q10) covering pod lifecycle,
      conformance testing, workspace repo ownership, credential model,
      network topology, versioning under load, multi-executor routing,
      billing units, failure attribution, and ABI versioning.

