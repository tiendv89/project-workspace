feature_id: platform-byo-executor
title: Bring-Your-Own-Executor — customer-supplied executor images on the platform

feature_status: blocked
current_stage: product_spec
next_action: >-
  Deferred. Activate (move feature_status from blocked to in_design) only
  after runtime-portable-architecture reaches done status. The product
  spec is a placeholder capturing the long-term direction; the technical
  design is intentionally empty until activation.

blocked_reason: prerequisite_not_done
blocked_details: >-
  Hard dependency on runtime-portable-architecture, which is currently
  in_design. This feature builds the customer-facing surface (image
  registration, conformance, tenant management, runner agents, push and
  pull production adapters, billing, self-service UI) on top of the
  architectural foundation runtime-portable-architecture delivers.
  Activating this feature before that prerequisite is done would force
  premature commitment on questions whose answers depend on the
  architecture.

