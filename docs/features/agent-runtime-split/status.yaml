feature_id: agent-runtime-split
title: Split agent runtime into orchestration and execution layers

feature_status: ready_for_implementation
current_stage: tasks
next_action: Wave 1 task T1 is `ready`. An agent (or the human) can run `start-implementation` against T1 to begin the runtime ABI work. T2 advances to ready when T1 is `done`; T3/T4/T5 advance when T2 is `done`.

stages:
  product_spec:
    review_status: approved
    reviewed_by: matthew@liquid-labs.xyz
    reviewed_at: 2026-05-01T22:33:32+0700
    review_comment: >-
      Approved. All eight open questions resolved as decisions D1–D10:
      logical split first with same-pod default; container ABI as the
      contract; workflow protocol owned entirely by orchestration;
      orchestrator is pure deterministic code with no embedded LLM;
      runtime parity (one ABI for every executor); explicit failure and
      budget semantics; single-cutover migration justified by alpha
      stage; promoted to top-level workflow/runtime/ tree.
    review_history:
      - at: 2026-05-01T22:33:32+0700
        by: matthew@liquid-labs.xyz
        action: approved
        note: >-
          Product spec approved after iterative discussion that resolved
          Q1–Q8 into D1–D10. Selector dependency line removed; relevant
          context propagated to agent-runtime-selector for when that
          feature is resumed.
  technical_design:
    review_status: approved
    reviewed_by: matthew@liquid-labs.xyz
    reviewed_at: 2026-05-01T23:01:07+0700
    review_comment: >-
      Approved. Design commits to TD-A2 (sub-process within same
      container) for process boundary and TD-B1 (big-bang restructure
      in one PR) for migration shape, with five planned tasks: T1 ABI,
      T2 split + cutover (with final subtask seeding T5 scope), T3
      tests, T4 docs, T5 orchestrator code quality pass. K8s and GH
      Actions templates are deleted in T2 to avoid orphaning. Future
      composition with agent-runtime-selector documented in §4.4.
    review_history:
      - at: 2026-05-01T23:01:07+0700
        by: matthew@liquid-labs.xyz
        action: approved
        note: >-
          Technical design approved after iterative refinement: option
          B selection switched from B3 (incremental) to B1 (big-bang)
          to align with alpha-stage cleanliness preference and avoid
          throwaway glue code; K8s/GH Actions templates moved from
          "leave as legacy" to "delete during cutover"; orchestrator
          quality refactor added as T5 with scope seeded by T2's final
