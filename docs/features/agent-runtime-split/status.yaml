feature_id: agent-runtime-split
title: Split agent runtime into orchestration and execution layers

feature_status: in_handoff
current_stage: handoff
next_action: >-
  Handoff document written covering 7-task arc, revised D5, termination
  safety, and CLAUDE_AGENT_RUNTIME guard pattern. Awaiting human approval
  to advance feature to done.

stages:
  product_spec:
    review_status: approved
    reviewed_by: matthew@liquid-labs.xyz
    reviewed_at: 2026-05-02T16:01:20+0700
    review_comment: >-
      Approved. All eight open questions resolved as decisions D1–D10:
      logical split first with same-pod default; container ABI as the
      contract; workflow protocol owned entirely by orchestration;
      orchestrator is pure deterministic code with no embedded LLM;
      runtime parity (one ABI for every executor); explicit failure and
      budget semantics; single-cutover migration justified by alpha
      stage; promoted to top-level workflow/runtime/ tree.
    review_history:
      - at: 2026-05-01T22:33:32+0700
        by: matthew@liquid-labs.xyz
        action: approved
        note: >-
          Product spec approved after iterative discussion that resolved
          Q1–Q8 into D1–D10. Selector dependency line removed; relevant
          context propagated to agent-runtime-selector for when that
          feature is resumed.
      - at: 2026-05-02T13:57:52+0700
        by: matthew@swellnetwork.io
        action: revision_submitted
        note: >-
          D5 revised to split PR ownership — executor opens impl PR
          (with rich body and test plan); orchestrator owns workspace
          PR + workflow state. Both PRs are part of the task lifecycle
          — opened independently of implementation outcome (workspace
          PR has always been opened at claim time; impl PR follows the
          same model going forward). Original D5 ("orchestrator opens
          the PR; runtimes never call pr-create") was silently violated
          by the implementation, which routed impl PR open through the
          /pr-create skill. result.json gains pr_url (workflow state),
          reported across all terminal_status values whenever a PR
          exists. No tests_passed field — orchestrator is pure
          workflow state (D4); executor's quality gate is private and
          reflected via terminal_status only. Awaiting re-approval
          before T6 can be implemented.
      - at: 2026-05-02T16:01:20+0700
        by: matthew@liquid-labs.xyz
        action: approved
        note: >-
          Revised D5 approved. Both PRs (workspace and impl) are task-
          lifecycle infrastructure, opened independently of
          implementation outcome. result.json schema gains pr_url
          only — no tests_passed (orchestrator stays pure workflow
          state per D4). current_stage advances from product_spec to
          technical_design for re-approval of the operationalization.
