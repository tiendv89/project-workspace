  tasks:
    review_status: approved
    reviewed_by: matthew@liquid-labs.xyz
    reviewed_at: 2026-05-01T23:06:34+0700
    review_comment: >-
      Approved. Five tasks (T1–T5) cover ABI definition, big-bang
