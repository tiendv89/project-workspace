history:
  - at: 2026-05-01T18:57:22+0700
    by: matthew@liquid-labs.xyz
    action: feature_created
    note: >-
      Feature initialized via /init-feature. Goal is to split the monolithic
      agent runtime into an orchestration layer (workspace polling, claim,
      PR handoff, state mutations) and an execution layer (Claude / Hermes /
      future executors). Product spec is in draft and ready for discussion.
  - at: 2026-05-01T18:57:22+0700
    by: matthew@liquid-labs.xyz
    action: spec_discussion
    note: >-
      Resolved Q1–Q6 with architecture decisions D1–D8. Key decisions:
      logical split first with same-pod default deployment; container ABI
      contract (env vars + result.json); workflow protocol owned entirely by
      orchestrator (runtimes are workflow-unaware); orchestrator is
      deterministic code with no embedded LLM; runtime parity (one ABI for
      all executors). Q7 (migration) and Q8 (repo placement) remain open.
  - at: 2026-05-01T22:23:54+0700
    by: matthew@liquid-labs.xyz
    action: spec_discussion
    note: >-
      Resolved Q7 as D9 (single-cutover migration; alpha stage means no flag
      / no dual-run) and Q8 as D10 (top-level workflow/runtime/ tree with
      orchestrator/, executors/claude/, abi/ subdirectories). Spec is
      complete and ready to submit for approval.
  - at: 2026-05-01T22:33:32+0700
    by: matthew@liquid-labs.xyz
    action: product_spec_approved
    note: >-
      Product spec approved. Feature advances from in_design to in_tdd;
      current_stage moves from product_spec to technical_design. Tech lead
      can now produce technical-design.md.
  - at: 2026-05-01T23:01:07+0700
    by: matthew@liquid-labs.xyz
    action: technical_design_approved
    note: >-
      Technical design approved. Design commits to TD-A2 (sub-process,
      same container) and TD-B1 (big-bang restructure) with five tasks:
      T1 ABI, T2 split, T3 tests, T4 docs, T5 orchestrator code
      quality pass. current_stage moves from technical_design to tasks.
      Tech lead can now run Phase 2 to produce tasks.md and per-task
      YAMLs.
  - at: 2026-05-01T23:06:34+0700
    by: matthew@liquid-labs.xyz
