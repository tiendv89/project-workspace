feature_id: agent-runtime-split
title: Split agent runtime into orchestration and execution layers

feature_status: in_tdd
current_stage: technical_design
next_action: Tech lead runs `tech-lead` (Phase 1) to produce technical-design.md based on the approved product spec and decisions D1–D10.

stages:
  product_spec:
    review_status: approved
    reviewed_by: matthew@liquid-labs.xyz
    reviewed_at: 2026-05-01T22:33:32+0700
    review_comment: >-
      Approved. All eight open questions resolved as decisions D1–D10:
      logical split first with same-pod default; container ABI as the
      contract; workflow protocol owned entirely by orchestration;
      orchestrator is pure deterministic code with no embedded LLM;
      runtime parity (one ABI for every executor); explicit failure and
      budget semantics; single-cutover migration justified by alpha
      stage; promoted to top-level workflow/runtime/ tree.
    review_history:
      - at: 2026-05-01T22:33:32+0700
        by: matthew@liquid-labs.xyz
        action: approved
        note: >-
          Product spec approved after iterative discussion that resolved
          Q1–Q8 into D1–D10. Selector dependency line removed; relevant
          context propagated to agent-runtime-selector for when that
          feature is resumed.
